<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <!-- 1. The Meta Refresh handles the instant browser redirect -->
    <meta http-equiv="refresh" content="0; url=https://nextgendiscloop.github.io">
    <!-- 2. The Canonical link preserves your SEO by telling Google where the real site is -->
    <link rel="canonical" href="https://your-new-website.com">
  </head>
  <body>
    <p>If you are not redirected automatically, follow this <a href="https://nextgendiscloop.github.io">link to our new site</a>.</p>
  </body>
</html>
